name: HabitTracker
options:
  bundleIdPrefix: com.bhumit
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: YES
targets:
  HabitTracker:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bhumit.habittracker
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  HabitTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: HabitTracker
schemes:
  HabitTracker:
    build:
      targets:
        HabitTracker: all
    test:
      targets: [HabitTrackerTests]
